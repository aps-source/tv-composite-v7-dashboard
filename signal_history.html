<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Signal History — TV Composite v7</title>
<style>
  :root {
    color-scheme: light;
    --page: #eceff8; --surface: #ffffff; --surface-2: #f3f5fb;
    --ink: #0e1320; --ink-2: #4f5a74; --ink-muted: #76829c;
    --hairline: #e2e7f1; --hairline-strong: rgba(14,19,32,0.12);
    --good: #12a150; --critical: #dc3545; --warn: #c77d00; --accent: #4f46e5;
    --brand-a: #4338ca; --brand-b: #7c3aed; --brand-c: #0d9488; --long: #2563eb; --short: #d6336c;
    --shadow: 0 1px 2px rgba(14,19,32,0.06), 0 8px 24px rgba(40,50,110,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #090c14; --surface: #131a29; --surface-2: #1a2336;
      --ink: #eef1f9; --ink-2: #a0abc4; --ink-muted: #7f8aa3;
      --hairline: #253048; --hairline-strong: rgba(238,241,249,0.14);
      --good: #2bc85a; --critical: #f0645f; --warn: #f2b636; --accent: #9b8cf3;
      --brand-a: #4f46e5; --brand-b: #8b5cf6; --brand-c: #14b8a6; --long: #4a8cf0; --short: #e0578a;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.32);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 480px at 8% -8%, color-mix(in srgb, var(--brand-b) 14%, transparent), transparent 70%),
      radial-gradient(900px 480px at 100% 0%, color-mix(in srgb, var(--brand-c) 12%, transparent), transparent 70%),
      var(--page);
    background-attachment: fixed;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 60px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px 24px; flex-wrap: wrap;
    background: linear-gradient(115deg, var(--brand-a) 0%, var(--brand-b) 55%, var(--brand-c) 100%); color: #fff;
    padding: 18px 22px; border-radius: 16px; box-shadow: 0 8px 26px color-mix(in srgb, var(--brand-a) 35%, transparent); }
  .topbar h1 { font-size: 21px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .topbar .sub { color: rgba(255,255,255,0.85); font-size: 12.5px; margin-top: 4px; }
  .back { display: inline-block; color: #fff; text-decoration: none; font-size: 12.5px; font-weight: 700; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 7px 14px; background: rgba(255,255,255,0.14); }
  .back:hover { background: rgba(255,255,255,0.26); border-color: #fff; }

  .filters { display: flex; gap: 10px; align-items: center; margin: 0 0 20px; flex-wrap: wrap; }
  .filters select, .filters button {
    background: var(--surface); border: 1px solid var(--hairline-strong); color: var(--ink-2);
    border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-family: inherit; cursor: pointer; box-shadow: var(--shadow);
  }
  .filters .spacer { flex: 1; }
  .filters .meta { color: var(--ink-muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--hairline-strong); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
  .muted { color: var(--ink-muted); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }

  .hist-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .hist-table th { text-align: left; color: var(--ink-muted); font-weight: 700; padding: 7px 8px; border-bottom: 2px solid var(--hairline); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .hist-table td { padding: 7px 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  .hist-table tr:hover td { background: var(--surface-2); }
  .hist-side { font-weight: 800; font-size: 11px; }
  .hist-side.LONG { color: var(--long); } .hist-side.SHORT { color: var(--short); }
  .hist-code { font-size: 10.5px; font-weight: 800; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .hist-code.fired { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
  .hist-code.blocked { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
  .hist-code.open { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }
  .hist-code.none { background: var(--surface-2); color: var(--ink-muted); }
  .hist-reasons { color: var(--ink-muted); font-size: 11.5px; }

  @media (max-width: 720px) {
    .wrap { padding: 16px 14px 50px; }
    .hist-table { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Signal History</h1>
      <div class="sub">Every evaluated signal — fired, blocked, or neither — one row per symbol per tick</div>
    </div>
    <a class="back" href="cockpit.html">&larr; Dashboard</a>
  </div>

  <div class="filters">
    <select id="hSymbol"><option value="ALL">All symbols</option><option value="NIFTY">NIFTY</option><option value="SENSEX">SENSEX</option></select>
    <select id="hOutcome">
      <option value="ALL">Every evaluation</option>
      <option value="FIRED">Signals fired (long or short)</option>
      <option value="BLOCKED">Blocked</option>
      <option value="OPEN">In position / proposed</option>
    </select>
    <div class="spacer"></div>
    <span class="meta" id="hMeta"></span>
    <button id="btnHistCsv">⬇ CSV</button>
  </div>
  <div class="card"><div id="sigHistory"><div class="muted">Loading signal history…</div></div></div>
</div>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function istNow() { return new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Kolkata'})); }
function fmtIst(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return '—';
  return new Date(t).toLocaleString('en-IN', {timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false}) + ' IST';
}
async function fetchJson(url) {
  try {
    const r = await fetch(url + '?t=' + Date.now(), {cache: 'no-store'});
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

let SIGHIST = null;

function histOutcome(row) {
  const code = (row.decision || {}).code;
  if (code === 'IN_POSITION' || code === 'ENTRY_PROPOSED' || code === 'EXIT_PROPOSED') return 'OPEN';
  if (code === 'SIGNAL_LONG' || code === 'SIGNAL_SHORT') return 'FIRED';
  if (code === 'BLOCKED') return 'BLOCKED';
  return 'NONE';
}

function renderSignalHistory() {
  const el = document.getElementById('sigHistory'), meta = document.getElementById('hMeta');
  if (!SIGHIST || !SIGHIST.length) {
    el.innerHTML = '<div class="muted">No signal history yet — this fills in as the scanner ticks (every 15 min, 09:31–15:46 IST).</div>';
    meta.textContent = '';
    return;
  }
  const symF = document.getElementById('hSymbol').value, outF = document.getElementById('hOutcome').value;
  const rows = SIGHIST.filter(r => (symF === 'ALL' || r.symbol === symF) && (outF === 'ALL' || histOutcome(r) === outF)).slice().reverse();
  meta.textContent = `${rows.length} of ${SIGHIST.length} evaluations shown`;
  if (!rows.length) { el.innerHTML = '<div class="muted">No evaluations match this filter.</div>'; return; }
  const codeCls = {FIRED: 'fired', BLOCKED: 'blocked', OPEN: 'open', NONE: 'none'};
  const trs = rows.map(r => {
    const d = r.decision || {}, o = histOutcome(r);
    const L = r.long ? Object.values(r.long.conditions).filter(Boolean).length : null;
    const S = r.short ? Object.values(r.short.conditions).filter(Boolean).length : null;
    const detail = d.detail || (r.blocked_reasons || []).join('; ');
    return `<tr>
      <td class="num">${esc(fmtIst(String(r.ts) + '+05:30'))}</td>
      <td><b>${esc(r.symbol)}</b></td>
      <td class="num">${r.close != null ? Number(r.close).toLocaleString('en-IN', {maximumFractionDigits: 2}) : '—'}</td>
      <td>${d.direction ? `<span class="hist-side ${esc(d.direction)}">${esc(d.direction)}</span>` : '<span class="muted">—</span>'}</td>
      <td class="num">${L != null ? L + '/5' : '—'}</td><td class="num">${S != null ? S + '/5' : '—'}</td>
      <td><span class="hist-code ${codeCls[o]}">${esc(d.code || '—')}</span></td>
      <td class="hist-reasons">${esc(detail)}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div style="overflow-x:auto;"><table class="hist-table"><thead><tr>
    <th>Tick (IST)</th><th>Symbol</th><th>Close</th><th>Direction</th><th>Long</th><th>Short</th><th>Outcome</th><th>Detail</th>
  </tr></thead><tbody>${trs}</tbody></table></div>`;
}

function downloadHistCsv() {
  if (!SIGHIST || !SIGHIST.length) return;
  const headers = ['ts', 'symbol', 'close', 'bar_time', 'decision_code', 'decision_direction', 'decision_detail', 'blocked_reasons'];
  const esc_csv = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [headers.join(',')].concat(SIGHIST.map(r => [
    r.ts, r.symbol, r.close, r.bar_time, (r.decision || {}).code, (r.decision || {}).direction,
    (r.decision || {}).detail, (r.blocked_reasons || []).join('; '),
  ].map(esc_csv).join(',')));
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tv_composite_v7_signal_history.csv';
  a.click();
}

async function refreshSignalHistory() { const d = await fetchJson('signal_history.json'); if (d) { SIGHIST = d; renderSignalHistory(); } }

document.getElementById('hSymbol').addEventListener('change', renderSignalHistory);
document.getElementById('hOutcome').addEventListener('change', renderSignalHistory);
document.getElementById('btnHistCsv').addEventListener('click', downloadHistCsv);
refreshSignalHistory();
setInterval(refreshSignalHistory, 120000);
const onWake = () => { if (document.visibilityState !== 'hidden') refreshSignalHistory(); };
document.addEventListener('visibilitychange', onWake);
window.addEventListener('focus', onWake);
</script>
</body>
</html>
